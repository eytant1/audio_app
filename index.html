<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Audio App">
  <title>Audio App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="card player">
      <div class="now">
        <div class="label">Now playing</div>
        <div id="title" class="title">Nothing yet</div>
        <div id="position" class="sub"></div>
      </div>

      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>

      <div class="controls">
        <button id="prev" title="Previous" aria-label="Previous">⏮</button>
        <button id="back10" title="Back 10 seconds" aria-label="Back 10 seconds">-10</button>
        <button id="play" class="big" title="Play / Pause" aria-label="Play">▶</button>
        <button id="fwd10" title="Forward 10 seconds" aria-label="Forward 10 seconds">+10</button>
        <button id="next" title="Next" aria-label="Next">⏭</button>
      </div>

      <div class="speed">
        <label for="speed">Speed <strong id="speedVal">1.00×</strong></label>
        <button id="speedDown" class="small" title="Slower" aria-label="Slower">−</button>
        <input id="speed" type="range" min="0.5" max="2" step="0.02" value="1">
        <button id="speedUp" class="small" title="Faster" aria-label="Faster">+</button>
        <button id="speedReset" class="small">1×</button>
      </div>

      <div class="options">
        <label><input id="keepPitch" type="checkbox"> Keep pitch when changing speed</label>
        <label><input id="repeat" type="checkbox"> Repeat playlist</label>
      </div>
    </section>

    <section class="card">
      <div class="head">
        <h2>My playlists</h2>
      </div>
      <p class="hint">Tap a playlist to open it.</p>
      <ul id="playlists" class="list"></ul>
    </section>

    <section class="card">
      <div class="head">
        <div>
          <h2 id="playlistName">New playlist</h2>
          <div id="playlistStatus" class="sub"></div>
        </div>
        <div class="buttons">
          <button id="newPlaylist" class="small">New</button>
          <button id="savePlaylist" class="small primary">Save</button>
        </div>
      </div>
      <p class="hint">Tap a song to play from there. Use ↑ ↓ to reorder. The same song can be added more than once.</p>
      <ol id="queue" class="list"></ol>
    </section>

    <section class="card">
      <div class="head">
        <h2>Library</h2>
        <button id="addAll" class="small">Add all to playlist</button>
      </div>
      <label class="upload">
        <input id="files" type="file" accept="audio/*,.mp3" multiple>
        <span>+ Add MP3 files</span>
      </label>
      <ul id="library" class="list"></ul>
    </section>
  </main>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
